<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diagram editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141518}
a{color:#8AB4FF}a:hover{color:#B7D0FF}
.cv{background-color:#F6F6F4;background-image:radial-gradient(#CFD1D6 1px,transparent 1px);background-size:16px 16px}
.rx{background-color:#1F2024;background-image:repeating-linear-gradient(90deg,#3A3D44 0 1px,transparent 1px 16px),repeating-linear-gradient(90deg,#4A4E57 0 1px,transparent 1px 80px);background-size:100% 5px,100% 10px;background-repeat:repeat-x;background-position:0 100%,0 100%}
.ry{background-color:#1F2024;background-image:repeating-linear-gradient(180deg,#3A3D44 0 1px,transparent 1px 16px),repeating-linear-gradient(180deg,#4A4E57 0 1px,transparent 1px 80px);background-size:5px 100%,10px 100%;background-repeat:repeat-y;background-position:100% 0,100% 0}
.fld{background:#2A2C31;border:1px solid transparent;border-radius:6px;color:#ECEDEF;font:500 12px/1 'IBM Plex Mono',ui-monospace,monospace;height:28px;box-sizing:border-box;padding:0 8px;width:100%;min-width:0;outline:none}
.fld:hover{border-color:#3A3D44}.fld:focus{border-color:#2563EB;background:#24262B}
.ib{background:transparent;border:0;color:#A1A4AB;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ib:hover{background:#2A2C31;color:#ECEDEF}
.row:hover{background:#26282D}
input[type=range]{accent-color:#2563EB}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #ECEDEF; background: #141518; font-size: 13px">

<header style="height: 48px; flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px; background: #18191C; border-bottom: 1px solid #2C2E33">
  <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
    <div aria-hidden="true" style="width: 26px; height: 26px; border-radius: 7px; background: #2563EB; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h5v5H6z M15.5 13a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7z M11 8.5h3.5v4"></path></svg>
    </div>
    <button type="button" class="ib" style="height: 30px; padding: 0 8px; gap: 6px; color: #ECEDEF; font: 600 13px 'IBM Plex Sans', system-ui, sans-serif">Untitled<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    <span style="color: #8E929A; font-size: 12px">Page 1</span>
  </div>

  <nav aria-label="Tools" style="display: flex; align-items: center; gap: 4px; padding: 3px; background: #1F2024; border: 1px solid #2C2E33; border-radius: 10px">
    <sc-for list="{{toolsA}}" as="t" hint-placeholder-count="2">
      <button type="button" class="ib" aria-label="{{t.label}}" title="{{t.title}}" onClick="{{t.pick}}" style="{{t.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></button>
    </sc-for>
    <div aria-hidden="true" style="width: 1px; height: 20px; background: #34363C; margin: 0 4px"></div>
    <sc-for list="{{toolsB}}" as="t" hint-placeholder-count="5">
      <button type="button" class="ib" aria-label="{{t.label}}" title="{{t.title}}" onClick="{{t.pick}}" style="{{t.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></button>
    </sc-for>
    <div aria-hidden="true" style="width: 1px; height: 20px; background: #34363C; margin: 0 4px"></div>
    <sc-for list="{{toolsC}}" as="t" hint-placeholder-count="3">
      <button type="button" class="ib" aria-label="{{t.label}}" title="{{t.title}}" onClick="{{t.pick}}" style="{{t.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></button>
    </sc-for>
  </nav>

  <div style="display: flex; align-items: center; gap: 6px">
    <button type="button" class="ib" aria-label="Undo" title="Undo (⌘Z)" style="width: 32px; height: 32px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
    <button type="button" class="ib" aria-label="Redo" title="Redo (⇧⌘Z)" style="width: 32px; height: 32px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5 M20 9H10a6 6 0 0 0 0 12h3"></path></svg></button>
    <div aria-hidden="true" style="width: 1px; height: 20px; background: #34363C; margin: 0 4px"></div>
    <button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #3A3D44; background: transparent; color: #ECEDEF; font: 500 13px 'IBM Plex Sans', system-ui, sans-serif; cursor: pointer">Export</button>
    <button type="button" style="height: 32px; padding: 0 14px; border-radius: 8px; border: 0; background: #2563EB; color: #FFFFFF; font: 600 13px 'IBM Plex Sans', system-ui, sans-serif; cursor: pointer">Share</button>
  </div>
</header>

<div style="flex: 1 0 auto; display: flex; flex-wrap: wrap; min-height: calc(100vh - 49px)">

  <aside aria-label="Pages and layers" style="flex: 1 1 248px; background: #1F2024; border-right: 1px solid #2C2E33; display: flex; flex-direction: column; min-width: 0">
    <div style="padding: 14px 12px 8px; display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A1A4AB">Pages</h2>
      <button type="button" class="ib" aria-label="Add page" style="width: 24px; height: 24px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 6px 12px">
      <button type="button" class="row" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 6px; background: #2A2C31; color: #ECEDEF; font: 500 13px 'IBM Plex Sans', system-ui, sans-serif; text-align: left; cursor: pointer">Page 1</button>
    </div>
    <div style="height: 1px; background: #2C2E33"></div>
    <div style="padding: 14px 12px 8px; display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A1A4AB">Layers</h2>
      <div style="display: flex; gap: 2px">
        <button type="button" class="ib" aria-label="Add layer" style="width: 24px; height: 24px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 1px; padding: 0 6px">
      <div class="row" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px; border-radius: 6px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A1A4AB" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A1A4AB" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5"></path></svg>
        <span style="flex: 1; font-weight: 500">Layer 1</span>
        <button type="button" class="ib" aria-label="Hide Layer 1" style="width: 24px; height: 24px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z"></path></svg></button>
        <button type="button" class="ib" aria-label="Lock Layer 1" style="width: 24px; height: 24px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v9H6z M9 11V8a3 3 0 0 1 6 0"></path></svg></button>
      </div>
      <button type="button" class="row" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 30px; border: 0; border-radius: 6px; background: transparent; color: #D4D6DA; font: 400 13px 'IBM Plex Sans', system-ui, sans-serif; text-align: left; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 5a8 7 0 1 0 0 14a8 7 0 1 0 0-14z"></path></svg>Start
      </button>
      <button type="button" class="row" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 30px; border: 0; border-radius: 6px; background: transparent; color: #D4D6DA; font: 400 13px 'IBM Plex Sans', system-ui, sans-serif; text-align: left; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M19 5L5 19 M5 13v6h6"></path></svg>Connector
      </button>
      <button type="button" aria-current="true" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 30px; border: 0; border-radius: 6px; background: #1E3A7A; color: #FFFFFF; font: 500 13px 'IBM Plex Sans', system-ui, sans-serif; text-align: left; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 5h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"></path></svg>Process
      </button>
    </div>
    <div style="flex: 1"></div>
    <div style="padding: 12px; border-top: 1px solid #2C2E33; display: flex; align-items: center; justify-content: space-between; color: #8E929A; font-size: 12px">
      <span>3 objects</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace">1 selected</span>
    </div>
  </aside>

  <main aria-label="Canvas" style="flex: 999 1 560px; min-width: 0; min-height: 640px; display: grid; grid-template-columns: 20px minmax(0, 1fr); grid-template-rows: 20px minmax(0, 1fr); background: #F6F6F4">
    <div style="background: #1F2024; border-right: 1px solid #2C2E33; border-bottom: 1px solid #2C2E33"></div>
    <div class="rx" style="position: relative; border-bottom: 1px solid #2C2E33; overflow: hidden">
      <div style="position: absolute; left: 280px; width: 300px; top: 0; bottom: 0; background: rgba(37, 99, 235, 0.35)"></div>
      <div style="position: absolute; left: 4px; top: 2px; display: flex; gap: 0; font: 400 9px 'IBM Plex Mono', ui-monospace, monospace; color: #8E929A">
        <span style="width: 160px">0</span><span style="width: 160px">160</span><span style="width: 160px">320</span><span style="width: 160px">480</span><span style="width: 160px">640</span><span>800</span>
      </div>
    </div>
    <div class="ry" style="position: relative; border-right: 1px solid #2C2E33; overflow: hidden">
      <div style="position: absolute; top: 240px; height: 190px; left: 0; right: 0; background: rgba(37, 99, 235, 0.35)"></div>
    </div>

    <div class="cv" style="position: relative; overflow: hidden">
      <div style="position: absolute; left: 88px; top: 222px; width: 112px; height: 124px; box-sizing: border-box; border-radius: 50%; background: #EAF2FF; border: 1.5px solid #2B3A67; display: flex; align-items: center; justify-content: center; color: #1B2547; font-weight: 500">Start</div>

      <svg aria-hidden="true" width="110" height="40" viewBox="0 0 110 40" style="position: absolute; left: 198px; top: 268px; overflow: visible">
        <path d="M82 22 L8 12" stroke="#2B3A67" stroke-width="1.5" fill="none"></path>
        <path d="M2 11 L13 7.5 L11.5 17 Z" fill="#2B3A67"></path>
        <circle cx="82" cy="22" r="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"></circle>
      </svg>

      <div style="position: absolute; left: 278px; top: 186px; display: flex; align-items: center; gap: 2px; padding: 4px; background: #1F2024; border-radius: 10px; box-shadow: 0 6px 20px rgba(20, 21, 24, 0.22)">
        <button type="button" class="ib" aria-label="Fill color" style="width: 28px; height: 28px"><span style="width: 16px; height: 16px; border-radius: 50%; background: #EAF2FF; border: 1px solid #5A5E66"></span></button>
        <button type="button" class="ib" aria-label="Stroke color" style="width: 28px; height: 28px"><span style="width: 16px; height: 16px; border-radius: 50%; border: 3px solid #5B7BD6; box-sizing: border-box"></span></button>
        <div aria-hidden="true" style="width: 1px; height: 18px; background: #34363C; margin: 0 2px"></div>
        <button type="button" class="ib" aria-label="Edit text" style="width: 28px; height: 28px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M5 6V5h14v1 M12 5v14 M9 19h6"></path></svg></button>
        <button type="button" class="ib" aria-label="Add connector" style="width: 28px; height: 28px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L19 5 M11 5h8v8"></path></svg></button>
        <button type="button" class="ib" aria-label="Duplicate" style="width: 28px; height: 28px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h11v11H9z M5 15V4h11"></path></svg></button>
        <button type="button" class="ib" aria-label="More actions" style="width: 28px; height: 28px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>
      </div>

      <div style="position: absolute; left: 280px; top: 240px; width: 300px; height: 190px; box-sizing: border-box; border-radius: 12px; background: #EAF2FF; border: 1.5px solid #2B3A67; display: flex; align-items: center; justify-content: center; color: #1B2547; font-weight: 500">Process</div>

      <div aria-hidden="true" style="position: absolute; left: 277px; top: 237px; width: 306px; height: 196px; box-sizing: border-box; border: 1.5px solid #2563EB; pointer-events: none">
        <span style="position: absolute; left: -5px; top: -5px; width: 8px; height: 8px; background: #FFFFFF; border: 1.5px solid #2563EB"></span>
        <span style="position: absolute; left: calc(50% - 5px); top: -5px; width: 8px; height: 8px; background: #FFFFFF; border: 1.5px solid #2563EB"></span>
        <span style="position: absolute; right: -5px; top: -5px; width: 8px; height: 8px; background: #FFFFFF; border: 1.5px solid #2563EB"></span>
        <span style="position: absolute; right: -5px; top: calc(50% - 5px); width: 8px; height: 8px; background: #FFFFFF; border: 1.5px solid #2563EB"></span>
        <span style="position: absolute; right: -5px; bottom: -5px; width: 8px; height: 8px; background: #FFFFFF; border: 1.5px solid #2563EB"></span>
        <span style="position: absolute; left: calc(50% - 5px); bottom: -5px; width: 8px; height: 8px; background: #FFFFFF; border: 1.5px solid #2563EB"></span>
        <span style="position: absolute; left: -5px; bottom: -5px; width: 8px; height: 8px; background: #FFFFFF; border: 1.5px solid #2563EB"></span>
        <span style="position: absolute; left: -5px; top: calc(50% - 5px); width: 8px; height: 8px; background: #FFFFFF; border: 1.5px solid #2563EB"></span>
        <span style="position: absolute; left: calc(50% - 4px); top: -26px; width: 8px; height: 8px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid #2563EB"></span>
        <span style="position: absolute; left: 50%; top: 208px; transform: translateX(-50%); padding: 3px 7px; border-radius: 5px; background: #2563EB; color: #FFFFFF; font: 500 11px 'IBM Plex Mono', ui-monospace, monospace; white-space: nowrap">300 × 190</span>
      </div>

      <div aria-hidden="true" style="position: absolute; left: 144px; top: 230px; width: 1px; height: 0"></div>
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 335px; height: 0; border-top: 1px dashed rgba(219, 39, 119, 0.55)"></div>

      <div style="position: absolute; right: 16px; bottom: 16px; width: 208px; display: flex; flex-direction: column; gap: 8px">
        <div style="background: #FFFFFF; border: 1px solid #E2E3E6; border-radius: 10px; padding: 8px; box-shadow: 0 4px 14px rgba(20, 21, 24, 0.08)">
          <div aria-label="Navigator" role="img" style="position: relative; height: 112px; border-radius: 6px; background: #F1F1EE; overflow: hidden">
            <span style="position: absolute; left: 22px; top: 38px; width: 13px; height: 15px; border-radius: 50%; border: 1px solid #2B3A67; background: #EAF2FF"></span>
            <span style="position: absolute; left: 46px; top: 40px; width: 36px; height: 22px; border-radius: 2px; border: 1px solid #2563EB; background: #EAF2FF"></span>
            <span style="position: absolute; left: 6px; top: 8px; width: 120px; height: 92px; border: 1.5px solid #2563EB; border-radius: 3px; background: rgba(37, 99, 235, 0.06)"></span>
          </div>
        </div>
        <div style="align-self: flex-end; display: flex; align-items: center; gap: 2px; padding: 3px; background: #FFFFFF; border: 1px solid #E2E3E6; border-radius: 10px; box-shadow: 0 4px 14px rgba(20, 21, 24, 0.08)">
          <button type="button" aria-label="Zoom out" onClick="{{zoomOut}}" style="width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: #3D4048; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <span style="min-width: 48px; text-align: center; font: 500 12px 'IBM Plex Mono', ui-monospace, monospace; color: #1B1C1F">{{zoomLabel}}</span>
          <button type="button" aria-label="Zoom in" onClick="{{zoomIn}}" style="width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: #3D4048; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button>
          <div aria-hidden="true" style="width: 1px; height: 18px; background: #E2E3E6; margin: 0 2px"></div>
          <button type="button" onClick="{{zoomFit}}" style="height: 30px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: #1B1C1F; font: 500 12px 'IBM Plex Sans', system-ui, sans-serif; cursor: pointer">Fit</button>
        </div>
      </div>

      <div style="position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #FFFFFF; border: 1px solid #E2E3E6; border-radius: 8px; color: #4A4D55; font-size: 12px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4h6v6H4z M14 14h6v6h-6z M10 7h7v7"></path></svg>
        <span>Snap to grid · 16 px</span>
      </div>
    </div>
  </main>

  <aside aria-label="Inspector" style="flex: 1 1 288px; background: #1F2024; border-left: 1px solid #2C2E33; display: flex; flex-direction: column; min-width: 0">
    <div role="tablist" aria-label="Inspector sections" style="display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid #2C2E33">
      <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{tab.selected}}" onClick="{{tab.pick}}" style="{{tab.style}}">{{tab.label}}</button>
      </sc-for>
    </div>

    <div style="padding: 14px 14px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2C2E33">
      <div aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #2A2C31; display: flex; align-items: center; justify-content: center; color: #8AB4FF">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 5h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-weight: 600">Process</span>
        <span style="font-size: 12px; color: #A1A4AB">Rounded rectangle</span>
      </div>
    </div>

    <sc-if value="{{showDesign}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column">
      <section style="padding: 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #2C2E33">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <label style="display: flex; align-items: center; gap: 6px; color: #8E929A; font-size: 11px"><span style="width: 12px">X</span><input class="fld" type="text" defaultValue="280"></label>
